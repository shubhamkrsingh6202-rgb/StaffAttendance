<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Staff Attendance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
                <i class="bi bi-calendar2-check me-2"></i>Staff Attendance
            </a>
            {% if session.get("staff_id") %}
                <div class="d-flex align-items-center gap-3">
                    {% if session.get("role") == "admin" %}
                        <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin_reports') }}">
                            <i class="bi bi-file-earmark-bar-graph me-1"></i>Reports
                        </a>
                    {% endif %}
                    <span class="navbar-text text-white">
                        {{ session.get("staff_name") }}
                    </span>
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
